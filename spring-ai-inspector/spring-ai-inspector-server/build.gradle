plugins {
	id 'org.springframework.boot'
	id 'io.spring.dependency-management'
	id 'com.google.cloud.tools.jib' version '3.5.4'
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('bootJar') {
	archiveFileName = 'spring-ai-inspector-server.jar'
}

tasks.named('jar') {
	enabled = false
}

jib {
	containerizingMode = 'packaged'
	from {
		image = 'eclipse-temurin:25-jre'
		platforms {
			platform {
				architecture = 'amd64'
				os = 'linux'
			}
		}
	}
	to {
		image = "spring-ai-inspector-server:${project.version}"
	}
	container {
		mainClass = 'org.springaicommunity.inspector.server.InspectorApplication'
		user = '10001:10001'
		ports = ['9001']
		environment = ['SERVER_ADDRESS': '0.0.0.0']
		workingDirectory = '/app'
		labels = providers.environmentVariable('INSPECTOR_IMAGE_METADATA')
			.filter { !it.isBlank() }
			.map { new groovy.json.JsonSlurper().parseText(it).labels }
			.getOrElse(['org.opencontainers.image.source': 'https://github.com/urferr/voxxeddays2026-demo'])
	}
}

tasks.register('uiTest', Exec) {
	group = 'verification'
	description = 'Runs the existing UI tests with Node.js (22 or later).'
	workingDir = projectDir
	commandLine(['node', '--test'] + fileTree('src/test/js') {
		include '*.test.mjs'
	}.files.sort().collect { it.absolutePath })
}

tasks.named('check') {
	dependsOn tasks.named('uiTest')
}
